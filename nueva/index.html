<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compras</title>
<style>body{font:17px/1.5 system-ui,sans-serif;background:#141414;color:#eee;max-width:420px;margin:48px auto;padding:0 20px}a{color:#d08a93;font-weight:700}</style>
</head><body>
<h2>La página de prueba ya no se usa</h2>
<p>La app de siempre ya anda con el servidor nuevo. Te llevamos ahí…</p>
<p><a href="../">compras-app.github.io/compras</a></p>
<script>
/* Fase 5 (13/10): la página de prueba se retiró. Se borra lo que guardó en este teléfono (sus "nueva_…", su copia y su
   service worker) y se va a la app de siempre. Lo de la app de siempre no se toca. */
(async function () {
  try { Object.keys(localStorage).filter(function (k) { return /^nueva(_|-)/.test(k); }).forEach(function (k) { localStorage.removeItem(k); }); } catch (e) {}
  try { (await caches.keys()).filter(function (k) { return /^nueva-/.test(k); }).forEach(function (k) { caches.delete(k); }); } catch (e) {}
  try { (await navigator.serviceWorker.getRegistrations()).forEach(function (r) { if (/\/nueva\/$/.test(r.scope)) r.unregister(); }); } catch (e) {}
  try { indexedDB.deleteDatabase('nueva-compras'); } catch (e) {}
  setTimeout(function () { location.replace('../'); }, 1500);
})();
</script>
</body></html>
